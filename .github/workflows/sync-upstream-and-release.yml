name: Sync upstream and release

on:
  schedule:
    # 每 6 小时自动检查并同步上游更新（遇纯 manifest 提交自动跳过，有真实冲突则保留告警 PR/Issue）
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream-and-release.yml'
      - '.github/scripts/sync-upstream.mjs'
      - '.github/scripts/rewrite-fork-repository.mjs'
      - '.github/scripts/check-fork-gate.mjs'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 即使上游仅更新了运行清单，也强制创建同步 PR
        type: boolean
        default: false
      auto_merge:
        description: 门禁校验全绿时自动合并同步 PR 并触发发布
        type: boolean
        default: true
      force_launcher:
        description: 即使启动器目录无改动，合并后也强制重打 launcher-current
        type: boolean
        default: false
      upstream_repo:
        description: 上游仓库（owner/repo）
        type: string
        default: flizzywine/dsh-tavern
      upstream_branch:
        description: 上游分支
        type: string
        default: main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  sync-and-pr:
    if: github.repository != 'flizzywine/dsh-tavern'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.sync.outputs.status }}
      merged_to_main: ${{ steps.pr.outputs.merged_to_main }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      upstream_commits: ${{ steps.sync.outputs.upstream_commits }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Sync upstream to staging branch & update upstream-main mirror
        id: sync
        shell: bash
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo || 'flizzywine/dsh-tavern' }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
          GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
          FORCE_SYNC: ${{ inputs.force_sync == true }}
        run: |
          set -euo pipefail
          node .github/scripts/sync-upstream.mjs --report-conflict

      - name: Close stale conflict tracking issue when main catches up
        if: steps.sync.outputs.status == 'up-to-date'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          issue_title="[Upstream Sync] 同步上游存在代码冲突"
          issue_num=$(gh issue list --state open --search "$issue_title in:title" --json number,title \
            --jq "map(select(.title == \"$issue_title\")) | .[0].number // empty" || true)
          if [[ -n "$issue_num" ]]; then
            gh issue close "$issue_num" --comment "上游最新提交 \`${UPSTREAM_SHA}\` 已同步至主分支，自动关闭本冲突提醒。"
          fi

      - name: Notify conflict tracking issue and abort
        if: steps.sync.outputs.status == 'conflict'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo || 'flizzywine/dsh-tavern' }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          SHORT_SHA: ${{ steps.sync.outputs.short_upstream_sha }}
          CONFLICT_FILES: ${{ steps.sync.outputs.conflict_files }}
          UPSTREAM_COMMITS: ${{ steps.sync.outputs.upstream_commits }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          issue_title="[Upstream Sync] 同步上游存在代码冲突"
          body_file="$RUNNER_TEMP/conflict-issue.md"
          {
            echo "自动同步上游 \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`（\`${SHORT_SHA}\`）时检测到需要人工裁决的代码冲突，已保护 \`${DEFAULT_BRANCH}\` 与自动发版不受影响。"
            echo ""
            echo "### 冲突文件"
            echo '```text'
            echo "$CONFLICT_FILES"
            echo '```'
            if [[ -n "$UPSTREAM_COMMITS" ]]; then
              echo ""
              echo "### 待合入的上游提交"
              echo '```text'
              echo "$UPSTREAM_COMMITS"
              echo '```'
            fi
            echo ""
            echo "### 本地推荐解决流程"
            echo '```sh'
            echo "git fetch upstream ${UPSTREAM_BRANCH}"
            echo "git checkout ${DEFAULT_BRANCH}"
            echo "git merge --no-ff upstream/${UPSTREAM_BRANCH}"
            echo "# 解决冲突后运行门禁校验并推送："
            echo "node .github/scripts/rewrite-fork-repository.mjs"
            echo "node .github/scripts/check-fork-gate.mjs"
            echo "git push origin ${DEFAULT_BRANCH}"
            echo '```'
            echo ""
            echo "_注：完成合并并推送后，下次自动同步检测到已对齐时将自动关闭本 Issue。_"
          } > "$body_file"

          issue_num=$(gh issue list --state open --search "$issue_title in:title" --json number,title \
            --jq "map(select(.title == \"$issue_title\")) | .[0].number // empty" || true)
          if [[ -n "$issue_num" ]]; then
            gh issue edit "$issue_num" --body-file "$body_file"
          else
            gh issue create --title "$issue_title" --body-file "$body_file" || echo "::warning::未能自动创建冲突跟踪 Issue，请检查 Actions Issues 写权限。"
          fi
          exit 1

      - name: Run Fork verification gate on sync branch
        id: gate
        if: steps.sync.outputs.status == 'ready'
        shell: bash
        run: |
          set -uo pipefail
          log_file="$RUNNER_TEMP/gate.log"
          if pnpm install --frozen-lockfile > "$log_file" 2>&1 \
            && node .github/scripts/check-fork-gate.mjs >> "$log_file" 2>&1; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "✅ 同步分支门禁测试全部通过。"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::同步分支门禁校验未通过，将保留 Sync PR 供排查，拒绝自动合并到主分支。"
          fi
          cat "$log_file"
          tail -n 60 "$log_file" > "$RUNNER_TEMP/gate-tail.log" || true

      - name: Create/update Sync PR and optionally auto-merge
        id: pr
        if: steps.sync.outputs.status == 'ready'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SYNC_BRANCH: ${{ steps.sync.outputs.sync_branch }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo || 'flizzywine/dsh-tavern' }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          SHORT_SHA: ${{ steps.sync.outputs.short_upstream_sha }}
          UPSTREAM_COMMITS: ${{ steps.sync.outputs.upstream_commits }}
          AUTO_RESOLVED: ${{ steps.sync.outputs.auto_resolved_files }}
          GATE_PASSED: ${{ steps.gate.outputs.passed }}
          INPUT_AUTO_MERGE: ${{ inputs.auto_merge }}
          VAR_AUTO_MERGE: ${{ vars.AUTO_MERGE_UPSTREAM_PR || 'true' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          merged_to_main=false
          auto_merge="$VAR_AUTO_MERGE"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            auto_merge="$INPUT_AUTO_MERGE"
          fi

          pr_title="chore: sync upstream ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} (${SHORT_SHA})"
          body_file="$RUNNER_TEMP/sync-pr.md"
          {
            echo "自动从 \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`（\`${UPSTREAM_SHA}\`）同步最新上游更新并完成 Fork 仓库引用重写。"
            echo ""
            if [[ "$GATE_PASSED" == "true" ]]; then
              echo "- **门禁校验**：✅ 通过（构建检查、引用校验、纯 Node 核心单测）"
            else
              echo "- **门禁校验**：❌ 失败（已拦截自动合入 \`${DEFAULT_BRANCH}\`，请查看下方失败摘要或 Actions 日志）"
            fi
            if [[ -n "$UPSTREAM_COMMITS" ]]; then
              echo ""
              echo "### 包含的上游提交"
              echo '```text'
              echo "$UPSTREAM_COMMITS"
              echo '```'
            fi
            if [[ -n "$AUTO_RESOLVED" ]]; then
              echo ""
              echo "### 已自动解决的派生/仓库引用冲突"
              echo '```text'
              echo "$AUTO_RESOLVED"
              echo '```'
            fi
            if [[ "$GATE_PASSED" != "true" && -s "$RUNNER_TEMP/gate-tail.log" ]]; then
              echo ""
              echo "### 门禁校验末尾日志"
              echo '```text'
              cat "$RUNNER_TEMP/gate-tail.log"
              echo '```'
            fi
          } > "$body_file"

          pr_number=$(gh pr list --state open --head "$SYNC_BRANCH" --base "$DEFAULT_BRANCH" --json number --jq '.[0].number // empty' || true)
          if [[ -z "$pr_number" ]]; then
            if ! pr_url=$(gh pr create --base "$DEFAULT_BRANCH" --head "$SYNC_BRANCH" --title "$pr_title" --body-file "$body_file" 2>"$RUNNER_TEMP/pr-err.log"); then
              cat "$RUNNER_TEMP/pr-err.log" >&2
              echo "::warning::无法由 Actions 自动创建 PR。请确认仓库 Settings → Actions → General → Workflow permissions 中已勾选 Allow GitHub Actions to create and approve pull requests；目前仍可通过分支 ${SYNC_BRANCH} 手动创建 PR。"
              printf 'merged_to_main=false\n' >> "$GITHUB_OUTPUT"
              [[ "$GATE_PASSED" == "true" ]] && exit 0 || exit 1
            fi
            pr_number=$(gh pr view "$pr_url" --json number --jq .number)
            echo "已创建同步 PR #${pr_number}: ${pr_url}"
          else
            gh pr edit "$pr_number" --title "$pr_title" --body-file "$body_file"
            echo "已更新既有同步 PR #${pr_number}"
          fi

          if [[ "$GATE_PASSED" == "true" && "$auto_merge" == "true" ]]; then
            if gh pr merge "$pr_number" --merge; then
              git push origin --delete "$SYNC_BRANCH" >/dev/null 2>&1 || true
              merged_to_main=true
              echo "PR #${pr_number} 已自动合入 ${DEFAULT_BRANCH}，即将触发发布流水线。"
              issue_title="[Upstream Sync] 同步上游存在代码冲突"
              issue_num=$(gh issue list --state open --search "$issue_title in:title" --json number,title \
                --jq "map(select(.title == \"$issue_title\")) | .[0].number // empty" || true)
              if [[ -n "$issue_num" ]]; then
                gh issue close "$issue_num" --comment "同步 PR #${pr_number} 已无冲突合并至 \`${DEFAULT_BRANCH}\`，自动关闭本冲突提醒。"
              fi
            else
              echo "::warning::PR #${pr_number} 门禁已通过，但未能自动合并（可能受分支保护规则限制），请前往 GitHub 手动点击 Merge。"
            fi
          elif [[ "$GATE_PASSED" != "true" ]]; then
            printf 'merged_to_main=false\n' >> "$GITHUB_OUTPUT"
            exit 1
          fi

          printf 'merged_to_main=%s\n' "$merged_to_main" >> "$GITHUB_OUTPUT"

  release-after-merge:
    needs: sync-and-pr
    if: github.repository != 'flizzywine/dsh-tavern' && needs.sync-and-pr.outputs.merged_to_main == 'true'
    uses: ./.github/workflows/fork-release.yml
    permissions:
      contents: write
    with:
      target_branch: ${{ github.event.repository.default_branch }}
      force_launcher: ${{ inputs.force_launcher == true }}
      skip_tests: true
      upstream_sha: ${{ needs.sync-and-pr.outputs.upstream_sha }}
      upstream_commits: ${{ needs.sync-and-pr.outputs.upstream_commits }}
